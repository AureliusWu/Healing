name: Recover interrupted full-dialogue takes
on:
  push:
    branches: [main]
    paths: ['docs/production/full-media/recovery-batch.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: recover-full-voice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production contracts
        run: python -m unittest discover -s tools/production -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39386271240
          pattern: full-voice-part-*
          path: reports/recovered-parts
      - name: Recover unchanged recordings with exact original evidence
        run: python tools/production/recover_voice.py --plan docs/production/full-media/dialogue-plan.json --parts reports/recovered-parts --output assets_source/voice/full-20261020 --report docs/production/full-media/recovery-report.json --run-id 39386271240
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-full-dialogue-${{ github.sha }}
          path: |
            assets_source/voice/full-20261020/
            docs/production/full-media/recovery-report.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve takes and pending sentences in the existing main history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets_source/voice/full-20261020 docs/production/full-media/recovery-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'production: recover verified dialogue takes and exact pending list [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
