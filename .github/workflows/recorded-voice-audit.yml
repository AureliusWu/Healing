name: Verify retained dialogue without synthesis
on:
  push:
    branches: [main]
    paths:
      - 'tools/production/**'
      - '.github/workflows/recorded-voice-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recorded-voice-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install only verification dependencies
        run: |
          python -m pip install Pillow==12.0.0 numpy==2.2.6 pypinyin==0.53.0 opencc-python-reimplemented==0.1.7
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check production failure paths
        run: python -m unittest discover -s tools/production -p 'test_*.py'
      - name: Export current authored dialogue without changing its retained plan
        run: node tools/production/export_dialogue.mjs reports/recorded-voice/current-dialogue.json
      - name: Verify source, retained bytes, shipped bindings and complete decode
        run: python tools/production/audit_recorded_voice.py --current-plan reports/recorded-voice/current-dialogue.json --decode --report reports/recorded-voice/audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-voice-audit-${{ github.sha }}
          path: reports/recorded-voice/
          retention-days: 90
          if-no-files-found: error
