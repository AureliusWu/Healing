name: Build game
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: MoistHealing-PWA
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MoistHealing-Previews
          path: test-results/previews/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Playwright-report
          path: playwright-report/
  windows:
    needs: web
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: MoistHealing-Windows-x64
          path: release/*.exe
          retention-days: 30
  release:
    needs: [web, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check version has indexed release notes
        id: version
        run: node scripts/check-release-notes.mjs
      - uses: actions/download-artifact@v4
        with:
          name: MoistHealing-Windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: MoistHealing-PWA
          path: pwa
      - name: Package complete PWA
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd pwa
          zip -q -r "../release-assets/MoistHealing-PWA-${RELEASE_VERSION}.zip" .
      - name: Publish verified version
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
