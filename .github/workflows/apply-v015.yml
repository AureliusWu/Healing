name: Apply v0.1.5 patch
on:
  push:
    branches: ['work/v0.1.5']
    paths:
      - 'scripts/apply-v015.mjs'
      - '.github/workflows/apply-v015.yml'
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-v015]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-v015.mjs
      - run: node scripts/check-release-notes.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.1.5 fullscreen fix and story expansion"
          git push origin HEAD:work/v0.1.5
