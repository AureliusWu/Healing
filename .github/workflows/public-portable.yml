name: Verify immutable public portable
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-portable.yml
      - tools/production/verify_public_portable.py
      - docs/production/PORTABLE-v1.5.4-REQUEST.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Launch the exact published portable wrapper
        run: python tools/production/verify_public_portable.py --request docs/production/PORTABLE-v1.5.4-REQUEST.json --output artifacts/public-portable/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Healing-public-portable-v1.5.4
          path: artifacts/public-portable/
          if-no-files-found: error
